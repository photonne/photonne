<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photonne</title>
<style>
  :root { --bg: #ffffff; --fg: #1d1d1f; --muted: #5f6368; --link: #0b57d0; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111214; --fg: #e8e8ea; --muted: #a0a3a8; --link: #8ab4f8; }
  }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 46rem; margin: 0 auto; padding: 2.5rem 1rem; }
  p { color: var(--muted); }
  a { color: var(--link); }
</style>
</head>
<body>
<main>
  <h1>Photonne</h1>
  <p>Servidor de fotos autoalojado y sus apps para Android, iOS y escritorio.</p>
  <ul>
    <li><a href="https://github.com/photonne/photonne">Código y documentación</a></li>
    <li><a href="https://github.com/photonne/photonne/issues">Soporte</a></li>
    <li><a href="privacy/">Política de privacidad</a> · <a href="privacy/#en">Privacy policy</a></li>
  </ul>
</main>
</body>
</html>

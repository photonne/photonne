# Actualizaciones de dependencias. Una PR al mes por ecosistema, con las
# versiones menores y de parche agrupadas; las mayores llegan cada una en su PR
# porque suelen pedir cambios. Los mensajes siguen Conventional Commits con el
# tipo build: release-please las lista en la sección "Dependencias" del changelog
# y abren release de parche; las de ci (actions) no.
version: 2

updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: build(server)
    groups:
      nuget-minor:
        update-types: [minor, patch]
    ignore:
      # La mayor de .NET se sube a mano y entera en una sola PR: TargetFramework,
      # global.json, estos paquetes y las imágenes dotnet del Dockerfile (ver el
      # ignore de docker). Por separado no compila, y Npgsql suele publicar su
      # versión final semanas después que EF Core y fija una EF exacta (11.0.0-rc.3
      # pedía EF 11.0.0-rc.3).
      - dependency-name: "Microsoft.AspNetCore.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.EntityFrameworkCore*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Npgsql*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /src/Client.SPA
    schedule:
      interval: monthly
    commit-message:
      prefix: build(spa)
    groups:
      # @vitest/browser-playwright pide la misma versión exacta de vitest, así
      # que por separado sus mayores no instalan (#133, #134): van juntos.
      vitest:
        patterns: ["vitest", "@vitest/*", "vitest-browser-svelte"]
      npm-minor:
        update-types: [minor, patch]
    ignore:
      # La mayor de TypeScript espera a que SvelteKit, svelte-check y
      # typescript-eslint la soporten (#137).
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: gradle
    directory: /src/Client.Native
    schedule:
      interval: monthly
    commit-message:
      prefix: build(native)
    groups:
      gradle-minor:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /src/Server.Ml
    schedule:
      interval: monthly
    commit-message:
      prefix: build(ml)
    groups:
      pip-minor:
        update-types: [minor, patch]
    ignore:
      # Van clavados a mano: onnxruntime-gpu se queda en la última rueda
      # compilada contra CUDA 12 y onnxruntime tiene que coincidir con ella en
      # requirements-gpu.txt (ver el comentario de ese fichero).
      - dependency-name: onnxruntime
      - dependency-name: onnxruntime-gpu

  - package-ecosystem: docker
    directories:
      - /src/Server.Api
      - /src/Server.Ml
    schedule:
      interval: monthly
    commit-message:
      prefix: build(docker)
    ignore:
      # La imagen CUDA se sube a mano. Las mayores tienen que casar con
      # onnxruntime-gpu (CUDA 12, ver src/Server.Ml/requirements-gpu.txt): con
      # otra, la GPU cae a CPU sin avisar (#128). Las menores suben el driver
      # mínimo del host (12.9 pide driver 575+ en GeForce y quita la rama 470,
      # ver Dockerfile.gpu) sin aportar nada (#144). Solo pasan los parches 12.8.x.
      - dependency-name: nvidia/cuda
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # Python también se sube a mano: una versión nueva tarda meses en tener
      # ruedas de onnxruntime, torch e insightface, y sin ellas la imagen ML no
      # se construye (3.15 rompió la de 1.201.2: onnxruntime no tenía rueda).
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # La mayor de .NET va con TargetFramework y los paquetes de NuGet en la misma
      # PR, a mano (ver el ignore de nuget): la imagen 11 con el código en net10.0
      # no arranca el servidor.
      - dependency-name: dotnet/aspnet
        update-types: ["version-update:semver-major"]
      - dependency-name: dotnet/sdk
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: build(docker)
    ignore:
      # Una versión mayor de PostgreSQL necesita pg_upgrade o volcar y restaurar
      # (docs/postgres-operations.md): se sube a mano.
      - dependency-name: pgvector/pgvector

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

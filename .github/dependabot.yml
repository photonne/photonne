# Actualizaciones de dependencias. Una PR al mes por ecosistema, con las
# versiones menores y de parche agrupadas; las mayores llegan cada una en su PR
# porque suelen pedir cambios. Los mensajes siguen Conventional Commits para
# que release-please no las cuente como novedades (build no sale en el changelog).
version: 2

updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: build(server)
    groups:
      nuget-minor:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /src/Client.SPA
    schedule:
      interval: monthly
    commit-message:
      prefix: build(spa)
    groups:
      # @vitest/browser-playwright pide la misma versión exacta de vitest, así
      # que por separado sus mayores no instalan (#133, #134): van juntos.
      vitest:
        patterns: ["vitest", "@vitest/*", "vitest-browser-svelte"]
      npm-minor:
        update-types: [minor, patch]
    ignore:
      # La mayor de TypeScript espera a que SvelteKit, svelte-check y
      # typescript-eslint la soporten (#137).
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: gradle
    directory: /src/Client.Native
    schedule:
      interval: monthly
    commit-message:
      prefix: build(native)
    groups:
      gradle-minor:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /src/Server.Ml
    schedule:
      interval: monthly
    commit-message:
      prefix: build(ml)
    groups:
      pip-minor:
        update-types: [minor, patch]
    ignore:
      # Van clavados a mano: onnxruntime-gpu se queda en la última rueda
      # compilada contra CUDA 12 y onnxruntime tiene que coincidir con ella en
      # requirements-gpu.txt (ver el comentario de ese fichero).
      - dependency-name: onnxruntime
      - dependency-name: onnxruntime-gpu

  - package-ecosystem: docker
    directories:
      - /src/Server.Api
      - /src/Server.Ml
    schedule:
      interval: monthly
    commit-message:
      prefix: build(docker)
    ignore:
      # La imagen CUDA tiene que casar con la que usa onnxruntime-gpu (CUDA 12,
      # ver src/Server.Ml/requirements-gpu.txt); con otra, la GPU cae a CPU sin
      # avisar (#128). Se sube a mano junto con onnxruntime-gpu.
      - dependency-name: nvidia/cuda
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: build(docker)
    ignore:
      # Una versión mayor de PostgreSQL necesita pg_upgrade o volcar y restaurar
      # (docs/postgres-operations.md): se sube a mano.
      - dependency-name: pgvector/pgvector

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

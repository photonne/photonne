name: Docker Image CI

on:
  push:
    branches: [main]
  workflow_dispatch:

# Build strategy: each arch is built on its OWN native runner (no QEMU) in
# parallel, then a final job assembles the multi-arch manifest list. Per-arch
# images are pushed by digest only (no tags), so the registry isn't polluted
# with intermediate per-arch tags — only the final :latest / :sha-... manifest
# lists carry tags.
#
# Versioning: every image carries the app version from Directory.Build.props
# as a tag (:1.158.1, :1.158) besides :latest / :sha-..., and once ALL images
# are pushed the `release` job tags the commit and publishes the GitHub
# Release that the servers' update check and the desktop app read. So a
# release existing always means its images exist.

# One main build at a time, in push order: two overlapping runs could leave
# :latest pointing at the older image and publish releases out of order. A
# queued run is superseded by a newer push, which is fine: the newest wins.
concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      minor: ${{ steps.read.outputs.minor }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read version from Directory.Build.props
        id: read
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Src/Directory.Build.props | head -n1)
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Unexpected version '$version' in Src/Directory.Build.props"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "minor=${version%.*}" >> "$GITHUB_OUTPUT"

  build-api:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure swap space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (labels only)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/photonne
          labels: |
            org.opencontainers.image.version=${{ needs.version.outputs.version }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Src/Photonne.Server.Api/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/photonne,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=api-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=api-${{ matrix.arch }}
          # Licencia de ImageSharp 4.x: montada como secret de BuildKit para que
          # no quede en capas ni en la caché; el Dockerfile la pasa a MSBuild.
          secrets: |
            sixlabors_lic=${{ secrets.SIXLABORS_LICENSE_KEY }}

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-api-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-api:
    needs: [version, build-api]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-api-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/photonne
          tags: |
            type=raw,value=${{ needs.version.outputs.version }},priority=1000,enable={{is_default_branch}}
            type=raw,value=${{ needs.version.outputs.minor }},enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Create multi-arch manifest and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository_owner }}/photonne@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ghcr.io/${{ github.repository_owner }}/photonne:${{ steps.meta.outputs.version }}

  build-ml:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure swap space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (labels only)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/photonne-ml
          labels: |
            org.opencontainers.image.version=${{ needs.version.outputs.version }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: Src/Photonne.MlService
          file: Src/Photonne.MlService/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/photonne-ml,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=ml-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=ml-${{ matrix.arch }}

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-ml-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-ml:
    needs: [version, build-ml]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-ml-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/photonne-ml
          tags: |
            type=raw,value=${{ needs.version.outputs.version }},priority=1000,enable={{is_default_branch}}
            type=raw,value=${{ needs.version.outputs.minor }},enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Create multi-arch manifest and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository_owner }}/photonne-ml@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ghcr.io/${{ github.repository_owner }}/photonne-ml:${{ steps.meta.outputs.version }}

  # GPU (NVIDIA/CUDA) variant of the ML image. amd64 only — the CUDA runtime
  # base has no arm64 wheels for onnxruntime-gpu and Jetson is out of scope.
  # Single-arch, so we push the tag directly (no push-by-digest + manifest
  # merge dance the multi-arch jobs above need). Published as :latest-gpu /
  # :<version>-gpu / :sha-<sha>-gpu; opt in via docker-compose.gpu.yml.
  build-ml-gpu:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure swap space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/photonne-ml
          tags: |
            type=raw,value=${{ needs.version.outputs.version }}-gpu,priority=1000,enable={{is_default_branch}}
            type=raw,value=${{ needs.version.outputs.minor }}-gpu,enable={{is_default_branch}}
            type=raw,value=latest-gpu,enable={{is_default_branch}}
            type=sha,prefix=sha-,suffix=-gpu
          labels: |
            org.opencontainers.image.version=${{ needs.version.outputs.version }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: Src/Photonne.MlService
          file: Src/Photonne.MlService/Dockerfile.gpu
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=ml-gpu
          cache-to: type=gha,mode=max,scope=ml-gpu

  # Publishes the GitHub Release v<version> once every image is in the
  # registry. Idempotent: a re-run, or a push that didn't bump the version
  # (e.g. a commit made on github.com, which skips the local hook), finds the
  # tag and does nothing.
  release:
    needs: [version, merge-api, merge-ml, build-ml-gpu]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.publish.outputs.tag }}
      created: ${{ steps.publish.outputs.created }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history + tags for the release notes

      - name: Create tag and release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          tag="v$VERSION"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" > /dev/null 2>&1 || git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
            echo "::notice::$tag already exists; no new release (was the version bumped?)"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ./scripts/release-notes.sh "$tag" "$GITHUB_SHA" > "$RUNNER_TEMP/notes.md"
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" \
            --notes-file "$RUNNER_TEMP/notes.md" --latest
          echo "created=true" >> "$GITHUB_OUTPUT"

  # A release created with GITHUB_TOKEN doesn't fire `release: published` in
  # other workflows, so the desktop installers are built from here.
  desktop:
    needs: release
    if: needs.release.outputs.created == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/desktop-release.yml
    with:
      tag: ${{ needs.release.outputs.tag }}

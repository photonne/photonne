name: Native client build

# Android + iOS (the desktop JVM target was retired, ADR-005).
#
# On a PR the iOS job compiles Kotlin/Native and builds the Xcode app but
# skips the common tests on the simulator (~13 min, the slowest step of the
# whole pipeline): the same commonTest already runs on the JVM in the Linux
# job. The simulator run happens on push to main and on a manual run.

on:
  push:
    branches: [main]
    paths:
      - 'src/Client.Native/**'
      - '.github/workflows/native-build.yml'
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/Client.Native/**'
      - '.github/workflows/native-build.yml'

concurrency:
  group: native-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile + test common + android (Linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Client.Native
    steps:
      - uses: actions/checkout@v7

      - name: Setup JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # The compileSdk platform (37) isn't in the runner's sdkmanager
          # channel under that name; AGP downloads it on demand, as before.
          # build-tools 35+ brings the `zipalign -P 16` used below.
          packages: 'platform-tools build-tools;35.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Compile Android (debug)
        run: ./gradlew :composeApp:compileDebugKotlinAndroid --stacktrace

      # commonTest + androidUnitTest on the host JVM (no emulator).
      - name: Run common tests on JVM
        run: ./gradlew :composeApp:testDebugUnitTest --stacktrace

      # R8 + resource shrinking + lintVital: catches missing keep rules and
      # fatal lint issues before a release is cut. Unsigned without secrets.
      - name: Assemble Android release
        run: ./gradlew :composeApp:assembleRelease :composeApp:bundleRelease --stacktrace

      # Play requires 16 KB page-size compatible native libraries (targetSdk
      # 35+). Fails if any .so in the bundle isn't 16 KB aligned.
      - name: Check 16 KB alignment
        run: |
          apk=$(ls composeApp/build/outputs/apk/release/*.apk | head -n1)
          zipalign=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n1)zipalign
          "$zipalign" -c -P 16 -v 4 "$apk" | grep -v "(OK" || true
          "$zipalign" -c -P 16 4 "$apk"

      - name: Upload R8 mapping
        uses: actions/upload-artifact@v7
        with:
          name: android-r8-mapping
          path: src/Client.Native/composeApp/build/outputs/mapping/release/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: native-test-reports
          path: src/Client.Native/composeApp/build/reports/
          retention-days: 7

  ios:
    name: Compile + test iOS (macOS)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: src/Client.Native
    steps:
      - uses: actions/checkout@v7

      - name: Setup JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # iosMain (Keychain, PhotoKit, BGTaskScheduler) only compiles here.
      - name: Compile iOS (simulator + device)
        run: ./gradlew :composeApp:compileKotlinIosSimulatorArm64 :composeApp:compileKotlinIosArm64 --stacktrace

      # Not on PRs: the Linux job already runs commonTest on the JVM.
      - name: Run common tests on the iOS simulator
        if: github.event_name != 'pull_request'
        run: ./gradlew :composeApp:iosSimulatorArm64Test --stacktrace

      # The Xcode app itself: Swift sources, Info.plist, privacy manifest and
      # the Gradle framework embed. Unsigned simulator build in Debug: a
      # Release configuration makes Kotlin/Native run its fully optimised
      # link, which takes well over half an hour on a hosted runner and
      # validates nothing extra here.
      - name: Build the Xcode app (simulator)
        timeout-minutes: 25
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj -target iosApp \
            -configuration Debug -sdk iphonesimulator \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO build

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: native-ios-test-reports
          path: src/Client.Native/composeApp/build/reports/
          retention-days: 7

# Releases with release-please (config in release-please-config.json), one
# per component, each with its own version, changelog and tag:
#
# | component | path (release-please)        | tag            | publishes                    |
# |-----------|------------------------------|----------------|------------------------------|
# | server    | . (minus ML, Native, docs)   | server-vX.Y.Z  | API image (SPA inside)       |
# | ml        | src/Server.Ml                | ml-vX.Y.Z      | ML image (+ -gpu)            |
# | native    | src/Client.Native            | native-vX.Y.Z  | release notes (stores: hand) |
#
# On every push to main release-please keeps ONE release PR open PER
# COMPONENT with releasable changes ("chore: release server X.Y.Z"...). A
# commit counts for the components whose paths it touches; the version bump
# comes from the Conventional Commits (feat -> minor, fix -> patch,
# `!` / BREAKING CHANGE -> major). Nothing is published while a PR stays open,
# and a change to the SPA alone never opens a release of the native app.
#
# Merging one of them is the "publish" button for THAT component:
# release-please tags the merge commit and creates the GitHub Release as a
# DRAFT, then this workflow builds only that component from the tag and only
# then publishes the release. So the servers' update check (which looks for
# the latest server-v* release) never sees a release whose images don't exist
# yet. A native release only carries its changelog: the Android and iOS builds
# go to the stores by hand from its tag. Only server releases are marked as
# GitHub's "Latest".
#
# Opening the release PRs needs either "Allow GitHub Actions to create and
# approve pull requests" (Organization settings -> Actions -> General, then the
# same box in the repo settings) or a RELEASE_PLEASE_TOKEN secret: a
# fine-grained PAT on this repo with Contents + Pull requests read/write. With
# the token the release PRs also run the PR checks like any other PR.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      # The root package (server) uses the unprefixed outputs; the others are
      # prefixed with their path.
      server_created: ${{ steps.rp.outputs.release_created }}
      server_tag: ${{ steps.rp.outputs.tag_name }}
      ml_created: ${{ steps.rp.outputs['src/Server.Ml--release_created'] }}
      ml_tag: ${{ steps.rp.outputs['src/Server.Ml--tag_name'] }}
      native_created: ${{ steps.rp.outputs['src/Client.Native--release_created'] }}
      native_tag: ${{ steps.rp.outputs['src/Client.Native--tag_name'] }}
      prs: ${{ steps.rp.outputs.prs }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

  # iOS doesn't read src/Client.Native/version.txt, so MARKETING_VERSION and
  # CURRENT_PROJECT_VERSION (= the semver version: App Store Connect compares
  # up to three integers field by field) are synced into the native release
  # PR. release-please rewrites the PR branch on every push, so this re-applies.
  sync-ios-version:
    needs: release-please
    if: contains(needs.release-please.outputs.prs, '--components--native')
    runs-on: ubuntu-latest
    steps:
      - name: Find the native release PR branch
        id: branch
        env:
          PRS: ${{ needs.release-please.outputs.prs }}
        run: |
          name=$(jq -r '.[] | select(.headBranchName | endswith("--components--native")) | .headBranchName' <<< "$PRS" | head -n1)
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Checkout native release PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.branch.outputs.name }}
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

      - name: Sync version into project.pbxproj
        run: |
          version=$(tr -d '[:space:]' < src/Client.Native/version.txt)
          pbx=src/Client.Native/iosApp/iosApp.xcodeproj/project.pbxproj
          sed -i -E "s/MARKETING_VERSION = [^;]*;/MARKETING_VERSION = $version;/g; s/CURRENT_PROJECT_VERSION = [^;]*;/CURRENT_PROJECT_VERSION = $version;/g" "$pbx"
          if git diff --quiet; then
            echo "project.pbxproj already at $version"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: sync iOS version to $version"
          git push

  # --- server: API image (the SPA is built into it) ---------------------------
  server-image:
    needs: release-please
    if: needs.release-please.outputs.server_created == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/api-image.yml
    with:
      release: true
      ref: ${{ needs.release-please.outputs.server_tag }}
    secrets: inherit

  server-publish:
    needs: [release-please, server-image]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.server_tag }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest

  # --- ml: ML image -----------------------------------------------------------
  ml-image:
    needs: release-please
    if: needs.release-please.outputs.ml_created == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/ml-image.yml
    with:
      release: true
      ref: ${{ needs.release-please.outputs.ml_tag }}

  ml-publish:
    needs: [release-please, ml-image]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.ml_tag }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false

  # --- native: nothing to build, only the release notes ----------------------
  native-publish:
    needs: release-please
    if: needs.release-please.outputs.native_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.native_tag }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false

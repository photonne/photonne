name: API image

# Two modes:
#
# - edge (push to main touching the server, or by hand): publishes
#   ghcr.io/<owner>/photonne:edge and :sha-<commit>. Never :latest nor a
#   version tag, so servers following :latest only get validated releases.
# - release (workflow_call from release.yml once release-please has tagged a
#   release): builds the tagged commit and publishes :<version>, :<minor> and
#   :latest. It is rebuilt rather than retagged from edge because the version
#   is baked into the binaries (Directory.Build.props) and the release commit
#   is the one that bumps it.
#
# Build strategy: each arch is built on its OWN native runner (no QEMU) in
# parallel, then a final job assembles the multi-arch manifest list. Per-arch
# images are pushed by digest only (no tags), so the registry isn't polluted
# with intermediate per-arch tags.

on:
  push:
    branches: [main]
    paths:
      - 'Src/**'
      - '!Src/Photonne.MlService/**'
      - '!Src/Photonne.Client.Native/**'
      - 'global.json'
      - '.github/workflows/api-image.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        description: Publish the version tags and :latest instead of :edge
        type: boolean
        default: false
      ref:
        description: Commit or tag to build (defaults to the triggering commit)
        type: string
        default: ''

# Edge builds run one at a time in push order (a queued run is superseded by
# a newer push: the newest wins). Each release gets its own group so a push
# landing meanwhile never cancels it.
concurrency:
  group: api-image-${{ inputs.release && format('release-{0}', inputs.ref) || format('edge-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  version:
    # The release-please merge commit is built by release.yml in release mode;
    # building it as edge too would just duplicate the work.
    if: >-
      inputs.release ||
      !startsWith(github.event.head_commit.message, 'chore: release ')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      minor: ${{ steps.read.outputs.minor }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Read version from Directory.Build.props
        id: read
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Src/Directory.Build.props | head -n1)
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Unexpected version '$version' in Src/Directory.Build.props"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "minor=${version%.*}" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Configure swap space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (labels only)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/photonne
          labels: |
            org.opencontainers.image.version=${{ needs.version.outputs.version }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Src/Photonne.Server.Api/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/photonne,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=api-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=api-${{ matrix.arch }}
          # Licencia de ImageSharp 4.x: montada como secret de BuildKit para que
          # no quede en capas ni en la caché; el Dockerfile la pasa a MSBuild.
          secrets: |
            sixlabors_lic=${{ secrets.SIXLABORS_LICENSE_KEY }}

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-api-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-api-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/photonne
          tags: |
            type=raw,value=${{ needs.version.outputs.version }},priority=1000,enable=${{ inputs.release == true }}
            type=raw,value=${{ needs.version.outputs.minor }},enable=${{ inputs.release == true }}
            type=raw,value=latest,enable=${{ inputs.release == true }}
            type=raw,value=edge,enable=${{ !inputs.release && github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,enable=${{ !inputs.release }}

      - name: Create multi-arch manifest and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository_owner }}/photonne@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ghcr.io/${{ github.repository_owner }}/photonne:${{ steps.meta.outputs.version }}

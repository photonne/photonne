name: ML image

# Same two modes as api-image.yml, for ghcr.io/<owner>/photonne-ml:
#
# - edge (push to main touching Src/Photonne.MlService, or by hand):
#   :edge / :sha-<commit> and the GPU variant :edge-gpu / :sha-<commit>-gpu.
# - release (workflow_call from release.yml): builds the tagged commit and
#   publishes :<version>, :<minor>, :latest and their -gpu counterparts, so
#   every release has a matching ML image even when the service didn't change
#   (the layers then come straight from the build cache).

on:
  push:
    branches: [main]
    paths:
      - 'Src/Photonne.MlService/**'
      - '.github/workflows/ml-image.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        description: Publish the version tags and :latest instead of :edge
        type: boolean
        default: false
      ref:
        description: Commit or tag to build (defaults to the triggering commit)
        type: string
        default: ''

concurrency:
  group: ml-image-${{ inputs.release && format('release-{0}', inputs.ref) || format('edge-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  version:
    if: >-
      inputs.release ||
      !startsWith(github.event.head_commit.message, 'chore: release ')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      minor: ${{ steps.read.outputs.minor }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Read version from Directory.Build.props
        id: read
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Src/Directory.Build.props | head -n1)
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Unexpected version '$version' in Src/Directory.Build.props"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "minor=${version%.*}" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Configure swap space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (labels only)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/photonne-ml
          labels: |
            org.opencontainers.image.version=${{ needs.version.outputs.version }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: Src/Photonne.MlService
          file: Src/Photonne.MlService/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/photonne-ml,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=ml-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=ml-${{ matrix.arch }}

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-ml-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-ml-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/photonne-ml
          tags: |
            type=raw,value=${{ needs.version.outputs.version }},priority=1000,enable=${{ inputs.release == true }}
            type=raw,value=${{ needs.version.outputs.minor }},enable=${{ inputs.release == true }}
            type=raw,value=latest,enable=${{ inputs.release == true }}
            type=raw,value=edge,enable=${{ !inputs.release && github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,enable=${{ !inputs.release }}

      - name: Create multi-arch manifest and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository_owner }}/photonne-ml@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ghcr.io/${{ github.repository_owner }}/photonne-ml:${{ steps.meta.outputs.version }}

  # GPU (NVIDIA/CUDA) variant. amd64 only — the CUDA runtime base has no arm64
  # wheels for onnxruntime-gpu and Jetson is out of scope. Single-arch, so we
  # push the tag directly (no push-by-digest + manifest merge dance the
  # multi-arch jobs above need). Opt in via docker-compose.gpu.yml.
  build-gpu:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Configure swap space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/photonne-ml
          tags: |
            type=raw,value=${{ needs.version.outputs.version }}-gpu,priority=1000,enable=${{ inputs.release == true }}
            type=raw,value=${{ needs.version.outputs.minor }}-gpu,enable=${{ inputs.release == true }}
            type=raw,value=latest-gpu,enable=${{ inputs.release == true }}
            type=raw,value=edge-gpu,enable=${{ !inputs.release && github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,suffix=-gpu,enable=${{ !inputs.release }}
          labels: |
            org.opencontainers.image.version=${{ needs.version.outputs.version }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: Src/Photonne.MlService
          file: Src/Photonne.MlService/Dockerfile.gpu
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=ml-gpu
          cache-to: type=gha,mode=max,scope=ml-gpu

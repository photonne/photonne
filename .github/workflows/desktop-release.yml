# Empaqueta la app de escritorio (DMG / MSI / DEB) en los tres SO y adjunta los
# instaladores a la release de GitHub. Lo llama release.yml (workflow_call) al
# hacer merge de la PR de release-please, mientras la release aún es borrador:
# release.yml la publica cuando los instaladores y las imágenes están subidos.
# También se puede lanzar a mano (workflow_dispatch): entonces los instaladores
# quedan como artifacts del run, sin release a la que subirlos.
#
# Sin firma ni notarización (documentado en docs/desktop-install.md): en macOS
# la app se abre con clic derecho > Abrir la primera vez; en Windows,
# SmartScreen avisará.
name: Desktop release

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to attach the installers to
        required: true
        type: string
  workflow_dispatch:

# Por etiqueta: dos releases seguidas no deben cancelarse los instaladores.
concurrency:
  group: desktop-release-${{ inputs.tag || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # subir assets a la release

jobs:
  package:
    name: Package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact-glob: composeApp/build/compose/binaries/main-release/dmg/*.dmg
          - os: windows-latest
            artifact-glob: composeApp/build/compose/binaries/main-release/msi/*.msi
          - os: ubuntu-latest
            artifact-glob: composeApp/build/compose/binaries/main-release/deb/*.deb
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: src/Client.Native
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.sha }}

      - name: Setup JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        if: runner.os != 'Windows'
        run: chmod +x ./gradlew

      # Never ship an installer whose tests fail.
      - name: Run tests
        run: ./gradlew :composeApp:desktopTest --stacktrace

      - name: Package installer
        run: ./gradlew :composeApp:packageReleaseDistributionForCurrentOS --stacktrace

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: photonne-desktop-${{ runner.os }}
          path: src/Client.Native/${{ matrix.artifact-glob }}
          if-no-files-found: error
          retention-days: 14

      - name: Attach installer to release
        if: inputs.tag != ''
        working-directory: src/Client.Native
        shell: bash
        run: gh release upload "$TAG" ${{ matrix.artifact-glob }} --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
